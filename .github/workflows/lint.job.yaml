name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: npm run lint

      - name: Type-check functions/
        run: npx tsc --noEmit --skipLibCheck -p functions/tsconfig.json

      - name: Security audit (high+ severity)
        # SheetJS CVE-2023-30533 resolved by pinning xlsx to the CDN-distributed
        # 0.20.3 (see package.json comment); enforced for real, no more warn-only.
        run: npm audit --omit=dev --audit-level=high
